<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="popa.js"></script>
    <script type="module" src="auth-ui.js"></script>
    <title>Реєстрація — NA1ZELCASE</title>
</head>
<body>
<div class="head"> 
<header>
    <button class="btn-nav" onclick="location.href='index.html'">NA1ZELCASE</button>
    <button class="btn-nav" onclick="location.href='account.html'">PROFILE</button>
    <button class="btn-nav" onclick="location.href='index.html'">SHOP</button>
</header>
</div>

<main class="registration-page">
    <section class="registration-card" aria-labelledby="registration-title">
        <p class="registration-eyebrow">NA1ZELCASE</p>
        <div class="auth-tabs" role="tablist" aria-label="Вхід або реєстрація">
            <button id="register-tab" class="auth-tab is-active" type="button" role="tab" aria-selected="true">Реєстрація</button>
            <button id="login-tab" class="auth-tab" type="button" role="tab" aria-selected="false">Вхід</button>
        </div>

        <section id="register-panel" role="tabpanel" aria-labelledby="register-tab">
            <h1 id="registration-title">Створити акаунт</h1>
            <p class="registration-description">Зареєструйся, щоб користуватися профілем.</p>

            <form id="registration-form">
                <label for="name">Ім’я</label>
                <input id="name" name="name" type="text" autocomplete="name" required>

                <label for="email">Електронна пошта</label>
                <input id="email" name="email" type="email" autocomplete="email" required>

                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                <span class="field-hint">Щонайменше 8 символів.</span>

                <label for="confirm-password">Повтори пароль</label>
                <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required>

                <button id="registration-submit" class="registration-submit" type="submit">Зареєструватися</button>
                <p id="registration-status" class="registration-status" role="status" aria-live="polite" hidden></p>
            </form>
        </section>

        <section id="login-panel" role="tabpanel" aria-labelledby="login-tab" hidden>
            <h1>Увійти</h1>
            <p class="registration-description">Увійди у свій акаунт NA1ZELCASE.</p>

            <form id="login-form">
                <label for="login-email">Електронна пошта</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required>

                <label for="login-password">Пароль</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>

                <button id="login-submit" class="registration-submit" type="submit">Увійти</button>
                <p id="login-status" class="registration-status" role="status" aria-live="polite" hidden></p>
            </form>
        </section>

        <div class="auth-divider"><span>або продовжити через</span></div>
        <div class="auth-provider-list">
            <button class="auth-provider-button" type="button" data-oauth-provider="google">
                <svg class="provider-icon google-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <defs>
                        <linearGradient id="google-mark-gradient" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#4285F4"/>
                            <stop offset=".38" stop-color="#34A853"/>
                            <stop offset=".64" stop-color="#FBBC05"/>
                            <stop offset=".84" stop-color="#EA4335"/>
                            <stop offset="1" stop-color="#4285F4"/>
                        </linearGradient>
                    </defs>
                    <path fill="url(#google-mark-gradient)" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
                </svg>
                <span>Google</span>
            </button>
            <button id="steam-login" class="auth-provider-button" type="button">
                <svg class="provider-icon steam-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z"/>
                </svg>
                <span>Steam</span>
            </button>
        </div>
        <p id="provider-status" class="registration-status" role="status" aria-live="polite" hidden></p>
    </section>
</main>
</body>
</html>
